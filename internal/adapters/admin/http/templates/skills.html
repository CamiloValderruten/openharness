{{define "content"}}
<div class="flex flex-col gap-6">
  <div class="flex items-center justify-between flex-wrap gap-4 pb-4 border-b border-white/5">
    <div>
      <h1 class="text-xl font-bold text-white tracking-tight">Skills Catalog</h1>
      <p class="text-xs text-slate-400">Discover and toggle runtime Agent Skills dynamically</p>
    </div>
  </div>

  <form style="display:none;"><input type="hidden" name="_csrf" value="{{.CSRFToken}}"></form>

  <div class="card-modern">
    <div id="skills-card"
         hx-get="/admin/fragments/skills"
         hx-trigger="load"
         hx-swap="innerHTML">
      <div class="text-center py-8 text-xs text-slate-500 font-mono">Loading skills catalog...</div>
    </div>
  </div>
</div>
{{end}}
