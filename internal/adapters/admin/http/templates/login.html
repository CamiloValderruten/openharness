{{define "content"}}
<div class="w-full max-w-md mx-auto p-6">
  <div class="card-modern bg-[#111726]/90 border border-white/10 shadow-2xl p-8 rounded-2xl backdrop-blur-xl">
    <div class="flex flex-col items-center text-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/30 mb-3">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-white tracking-tight">OpenHarness</h1>
      <p class="text-xs text-slate-400 mt-1">Sign in to access Web Chat and Control Center</p>
    </div>

    {{if .Error}}
    <div class="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs flex items-center gap-2">
      <svg class="w-4 h-4 shrink-0 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span>{{.Error}}</span>
    </div>
    {{end}}

    <form method="POST" action="/admin/login" class="flex flex-col gap-4">
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
      <input type="hidden" name="next" value="{{.Next}}">

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username</label>
        <input type="text"
               name="username"
               required
               autofocus
               autocomplete="username"
               placeholder="admin"
               class="w-full px-3.5 py-2.5 rounded-xl bg-[#090d16] border border-white/10 text-white text-sm focus:outline-none focus:border-indigo-500 transition-colors"
               value="{{.Username}}">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <input type="password"
               name="password"
               required
               autocomplete="current-password"
               placeholder="••••••••"
               class="w-full px-3.5 py-2.5 rounded-xl bg-[#090d16] border border-white/10 text-white text-sm focus:outline-none focus:border-indigo-500 transition-colors">
      </div>

      <button type="submit"
              class="w-full mt-2 py-2.5 px-4 rounded-xl bg-gradient-to-r from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 text-white font-medium text-sm transition-all shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2">
        <span>Sign in</span>
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>
    </form>
  </div>
</div>
{{end}}
