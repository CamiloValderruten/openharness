{{define "content"}}
<div class="flex flex-col gap-6">
  <div class="flex items-center justify-between flex-wrap gap-4 pb-4 border-b border-white/5">
    <div>
      <h1 class="text-xl font-bold text-white tracking-tight">Version & Updates // version &amp; updates</h1>
      <p class="text-xs text-slate-400">Manage OpenHarness runtime versions and GitHub releases</p>
    </div>
  </div>

  <div class="admin-grid">
    <div class="metric-card">
      <div class="metric-label">Running Version</div>
      <div class="metric-value font-mono text-xl text-white">{{.Version}}</div>
      <div class="metric-sub">{{.GoVersion}}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Uptime</div>
      <div class="metric-value font-mono text-xl text-white">{{.Uptime}}</div>
      <div class="metric-sub">Started at {{.StartedAt}}</div>
    </div>
  </div>

  <div class="card-modern">
    <div id="update-card"
         hx-get="/admin/fragments/update"
         hx-trigger="load, every 30s"
         hx-swap="innerHTML">
      <div class="text-center py-8 text-xs text-slate-500 font-mono">Checking update status...</div>
    </div>
  </div>
</div>
{{end}}
