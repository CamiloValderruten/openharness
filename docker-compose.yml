services:
  coco:
    build: .
    image: openharness:latest
    container_name: openharness-coco
    user: "${PUID:-1000}:${PGID:-1003}"
    command: ["-config", "/config/config.toml"]
    stop_grace_period: 3m
    environment:
      - TZ=America/New_York
    group_add:
      - "${DOCKER_GID:-986}"
    ports:
      # HTML publishing harness — Cloudflare Tunnel via host.docker.internal
      - "8751:8751"
    volumes:
      - /home/camilovalderruten/openharness/coco.config.toml:/config/config.toml:ro
      - /home/camilovalderruten/.openharness/agents/coco:/agent:rw
      - /home/camilovalderruten/.openharness/shared/memory:/agent/memory/shared:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/camilovalderruten/.openharness/agents/coco/sandbox:/home/camilovalderruten/.openharness/agents/coco/sandbox:rw
    restart: unless-stopped

  arlo:
    build: .
    image: openharness:latest
    container_name: openharness-arlo
    user: "${PUID:-1000}:${PGID:-1003}"
    command: ["-config", "/config/config.toml"]
    stop_grace_period: 3m
    environment:
      - TZ=America/New_York
    group_add:
      - "${DOCKER_GID:-986}"
    ports:
      # HTML publishing harness — Cloudflare Tunnel via host.docker.internal
      - "8750:8750"
      # Modern Web Chat & Control Center
      - "8710:8710"
      # Authenticated inbox webhook — loopback only (HA / n8n / Shortcuts)
      - "127.0.0.1:8760:8760"
    volumes:
      - /home/camilovalderruten/openharness/arlo.config.toml:/config/config.toml:ro
      - /home/camilovalderruten/.openharness/agents/arlo:/agent:rw
      - /home/camilovalderruten/.openharness/shared/memory:/agent/memory/shared:rw
      - /home/camilovalderruten/.openharness/agents/arlo/sandbox:/home/camilovalderruten/.openharness/agents/arlo/sandbox:rw
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
